name: Release

# Mirrors cspace's release strategy: tag a `v*` ref, get a multi-platform
# GitHub Release with binaries that downstream consumers (cspace's
# Dockerfile, the planned Homebrew tap, install scripts) can fetch.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: cspace-search-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: cspace-search-linux-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: cspace-search-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: cspace-search-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install build deps (macOS)
        if: contains(matrix.os, 'macos')
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Stage binary
        run: |
          mkdir -p staged
          cp target/${{ matrix.target }}/release/cspace-search staged/${{ matrix.asset }}
          chmod +x staged/${{ matrix.asset }}

      - name: Smoke-test (--version)
        run: ./staged/${{ matrix.asset }} --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staged/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute checksums
        run: |
          mkdir -p release
          for f in artifacts/*/cspace-search-*; do
            cp "$f" release/
          done
          cd release
          sha256sum cspace-search-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cspace-search-*
            release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
